name: Tønsberglivet Autonomous Agent & Data Sync

on:
  schedule:
    # Kjører hver morgen kl. 05:00 UTC (07:00 norsk sommertid)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  agent-sync-and-audit:
    name: Synkroniser arrangementer og valider agent
    runs-on: ubuntu-latest

    # Uten dette kan to kjøringer overlappe, lese samme kursor og gå gjennom
    # samme feed-område. Det gir duplikatarbeid og unødig last mot NAV, som
    # svarer 504 når det blir for mange samtidige oppslag.
    concurrency:
      group: daily-agent-sync
      cancel-in-progress: false

    # Backfillen deles over flere kall, så jobben trenger rom – men ikke ubegrenset.
    timeout-minutes: 45

    # Ligger på jobbnivå fordi et stegs `if:` ikke kan lese stegnivå-`env`.
    # Med env på stegnivå var `if: env.PRODUCTION_URL != ''` alltid usann, og
    # hele synkroniseringen ble stille hoppet over.
    env:
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer avhengigheter
        run: npm ci

      - name: Generer Prisma-klient
        run: npx prisma generate

      - name: Kjør TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Trigger daglig nattlig synkronisering (hvis produksjons-URL er konfigurert)
        if: env.PRODUCTION_URL != ''
        run: |
          echo "Kaller nattlig synkroniserings-endepunkt for Tønsberglivet..."
          curl -s --max-time 900 -X POST "$PRODUCTION_URL/api/cron/daily-sync?key=$CRON_SECRET" \
            -H "Content-Type: application/json"

      - name: Synkroniser stillinger fra NAV Arbeidsplassen
        if: env.PRODUCTION_URL != ''
        run: |
          # NAV-feeden er en endringsstrøm. Første kjøring gjør en backfill over
          # 182 dager (~376 sider); den deles over flere kall og fortsetter fra en
          # lagret kursor. 50 sider per runde holder hvert kall godt innenfor
          # --max-time, og 12 runder dekker 600 sider – mer enn nok.
          for i in $(seq 1 12); do
            RESPONSE=$(curl -s --max-time 600 -X POST \
              "$PRODUCTION_URL/api/cron/nav-jobs?key=$CRON_SECRET&pages=50")
            echo "Runde $i: $RESPONSE"

            COMPLETE=$(echo "$RESPONSE" | jq -r '.data.backfillComplete // false')
            if [ "$COMPLETE" = "true" ]; then
              echo "Backfill fullført."
              break
            fi

            if [ "$(echo "$RESPONSE" | jq -r '.success // false')" != "true" ]; then
              echo "Synken feilet – avbryter."
              exit 1
            fi
          done

